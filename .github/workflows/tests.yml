name: Python tests

on:
  push:
    branches:
      - main
      - feature/hapus-item-persediaan
      - feature/login-otorisasi
  pull_request:
    branches:
      - main
      - feature/hapus-item-persediaan

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pytest (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile application modules
        run: python -m compileall -q app.py database services utils views
      - name: Run test suite
        run: python -m pytest tests/ -v
