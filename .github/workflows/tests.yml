name: Python tests

on:
  push:
    branches:
      - main
      - feature/hapus-item-persediaan
      - feature/login-otorisasi
      - feature/ui-enterprise
  pull_request:
    branches:
      - main
      - feature/hapus-item-persediaan
      - feature/login-otorisasi

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Compile and pytest (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile application modules
        run: python -m compileall -q app.py database services utils views
      - name: Run test suite
        run: python -m pytest tests/ -v
      - name: Read-only HPP migration preflight on disposable snapshot
        shell: bash
        run: |
          set +e
          if [ ! -f database/akuntansi_cabai_hpp_branch_snapshot.db ]; then
            echo "::warning::HPP snapshot is unavailable in this checkout; migration validation is pending."
            exit 0
          fi
          cp database/akuntansi_cabai_hpp_branch_snapshot.db database/akuntansi_cabai.db || exit 1
          python scripts/migrasi_hpp_data_contoh.py > "${RUNNER_TEMP}/hpp-preview.log" 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "Read-only HPP migration preflight passed on disposable snapshot."
            exit 0
          fi
          log="${RUNNER_TEMP}/hpp-preview.log"
          reason="validation_needs_review"
          if grep -q "Snapshot saldo awal Oktober yang ada berbeda dari asumsi contoh" "$log"; then
            reason="opening_inventory_snapshot_differs_from_sample_assumption"
          elif grep -q "Saldo awal akun 1307 Oktober sudah ada dengan nilai berbeda" "$log"; then
            reason="opening_inventory_account_balance_conflict"
          elif grep -q "Ada saldo awal November yang bukan hasil migrasi ini" "$log"; then
            reason="manual_november_opening_balance_present"
          elif grep -q "Nilai buku akun 1307 tidak sama dengan kartu persediaan" "$log"; then
            reason="inventory_gl_vs_stock_card_mismatch"
          elif grep -q "Tidak ditemukan transaksi Penjualan Cabai" "$log"; then
            reason="no_matching_chili_sales_found"
          elif grep -q "Kuantitas kg tidak terbaca" "$log"; then
            reason="sale_quantity_could_not_be_parsed"
          elif grep -q "Stok tidak cukup" "$log"; then
            reason="insufficient_inventory_for_sales"
          elif grep -q "Mutasi persediaan lama" "$log"; then
            reason="legacy_inventory_movement_needs_reconciliation"
          elif grep -q "ValueError" "$log"; then
            reason="sample_migration_validation_value_error"
          fi
          echo "::warning::HPP data preflight needs review ($reason). No migration was applied; detailed financial output is suppressed."
          exit 0
