services:
  akuntansi-cabai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: akuntansi-cabai
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      BOOTSTRAP_SETUP_KEY: ${BOOTSTRAP_SETUP_KEY:?Set BOOTSTRAP_SETUP_KEY in .env before starting}
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_ENABLE_CORS: "false"
    volumes:
      # Persistent SQLite database: survives container recreation and image updates.
      - ./database:/app/database
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
